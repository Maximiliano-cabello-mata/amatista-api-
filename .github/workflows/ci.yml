# CI de la API: pruebas con SQLite temporal (nunca Oracle real) y el motor
# clonado al lado, como en la instancia de producción.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      AMATISTA_SIN_LIMITES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: amatista-api-

      # El motor que la API importa (backend/vecinos.py lo busca en la carpeta hermana).
      # Se coloca exactamente en la revisión fijada en MOTOR_VERSION.
      - uses: actions/checkout@v4
        with:
          repository: Maximiliano-cabello-mata/amatista-motor-
          path: amatista-motor-
          fetch-depth: 0

      - name: Fijar versión del motor (MOTOR_VERSION)
        run: |
          ref="$(grep -v '^#' amatista-api-/MOTOR_VERSION | tr -d '[:space:]')"
          git -C amatista-motor- checkout "$ref"

      # La web que la API valida en test_pasos_lecciones.py (backend/vecinos.py).
      # El repositorio de la web es privado: el token de este flujo no lo puede leer.
      # Con el secreto AMATISTA_WEB_TOKEN (un token con lectura de ese repositorio) se
      # clona y corren las pruebas de contrato con las lecciones. Sin él, este paso
      # falla sin detener el trabajo y esas pruebas se saltan con su aviso.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Maximiliano-cabello-mata/amatista-recuperada-20261106
          path: amatista-recuperada-20261106
          token: ${{ secrets.AMATISTA_WEB_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: amatista-api-/backend/requirements*.txt

      - name: Instalar dependencias
        working-directory: amatista-api-/backend
        run: pip install -r requirements-dev.txt pyyaml Pillow

      - name: Pruebas de la API
        working-directory: amatista-api-/backend
        run: python -m pytest -q -rs

      - name: Sintaxis de las herramientas de la instancia
        working-directory: amatista-api-
        run: bash -n despliegue/amatista && bash -n despliegue/actualizar.sh
